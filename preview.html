ces</p><div><i class=\"tg\">#javascript</i><i class=\"tg\">#ui</i><i class=\"tg\">#frontend</i></div><div class=\"meta\" style=\"margin-top:12px\"><span class=\"pill star\">★ 182.0k</span><span>JavaScript</span><span>更新 2026-11-14</span><span>难度 入门</span></div><div class=\"acts\" style=\"margin-top:16px;display:flex;gap:8px\"><a class=\"btn btn-p\" href=\"https://github.com/facebook/react\" target=\"_blank\" rel=\"noopener\">GitHub ↗</a><button class=\"btn\" data-copy=\"https://YOUR_DOMAIN/zh/p-gh-facebook-react.html\">复制链接</button></div></div><section class=\"comm\" id=\"s-download\"><h2>发布与下载</h2><p class=\"comm-hint\">来自 GitHub 官方 Releases，本站不托管文件 · v19.0.0 · 2026-10-28</p><div class=\"proxy-bar\"><label>下载通道</label><select id=\"pxSel\"><option value=\"\" selected>官方直连</option><option value=\"https://ghproxy.net/\">GHProxy 镜像</option><option value=\"https://ghfast.top/\">GHFast 镜像</option></select><span class=\"hint\">切换后所有下载链接即时改写，文件不变</span></div><div class=\"asset\"><div class=\"f\">react-v19.0.0.tar.gz<small>1.8 MB</small></div><a class=\"btn dl-link\" data-official=\"https://github.com/facebook/react/releases/download/v19.0.0/react-v19.0.0.tar.gz\" href=\"https://github.com/facebook/react/releases/download/v19.0.0/react-v19.0.0.tar.gz\" target=\"_blank\" rel=\"noopener nofollow\">官方下载</a></div><div class=\"asset\"><div class=\"f\">react-dom-v19.0.0.tar.gz<small>2.1 MB</small></div><a class=\"btn dl-link\" data-official=\"https://github.com/facebook/react/releases/download/v19.0.0/react-dom-v19.0.0.tar.gz\" href=\"https://github.com/facebook/react/releases/download/v19.0.0/react-dom-v19.0.0.tar.gz\" target=\"_blank\" rel=\"noopener nofollow\">官方下载</a></div><aside class=\"ad\" data-slot=\"detail_end\"><div class=\"ad-hd\"><span>广告</span></div><div class=\"ad-v\" data-start=\"\" data-end=\"\"><a href=\"submit.html\"><h4>也推荐一个项目？</h4><p>提交后进入人工审核队列。</p><span class=\"ad-cta\">去提交</span></a></div></aside></section><div class=\"rm-bar\"><b>项目说明</b></div><div class=\"md-clip\" id=\"clip-mdBody\"><article class=\"md\" id=\"mdBody\"><p>React is a JavaScript library for building user interfaces.</p><ul><li><b>Declarative:</b> React makes it painless to create interactive UIs. Design simple views for each state in your application, and React will efficiently update and render just the right components when your data changes. Declarative views make your code more predictable, simpler to understand, and easier to debug.</li><li><b>Component-Based:</b> Build encapsulated components that manage their own state, then compose them to make complex UIs. Since component logic is written in JavaScript instead of templates, you can easily pass rich data through your app and keep the state out of the DOM.</li><li><b>Learn Once, Write Anywhere:</b> We don&#x27;t make assumptions about the rest of your technology stack, so you can develop new features in React without rewriting existing code. React can also render on the server using <a href=\"https://nodejs.org/en\" target=\"_blank\" rel=\"noopener\">Node</a> and power mobile apps using <a href=\"https://reactnative.dev/\" target=\"_blank\" rel=\"noopener\">React Native</a>.</li></ul><p><a href=\"https://react.dev/learn\" target=\"_blank\" rel=\"noopener\">Learn how to use React in your project</a>.</p><h2 id=\"Installation\">Installation</h2><p>React has been designed for gradual adoption from the start, and <b>you can use as little or as much React as you need</b>:</p><ul><li>Use <a href=\"https://react.dev/learn\" target=\"_blank\" rel=\"noopener\">Quick Start</a> to get a taste of React.</li><li><a href=\"https://react.dev/learn/add-react-to-an-existing-project\" target=\"_blank\" rel=\"noopener\">Add React to an Existing Project</a> to use as little or as much React as you need.</li><li><a href=\"https://react.dev/learn/start-a-new-react-project\" target=\"_blank\" rel=\"noopener\">Create a New React App</a> if you&#x27;re looking for a powerful JavaScript toolchain.</li></ul><h2 id=\"Documentation\">Documentation</h2><p>You can find the React documentation <a href=\"https://react.dev/\" target=\"_blank\" rel=\"noopener\">on the website</a>.</p><p>Check out the <a href=\"https://react.dev/learn\" target=\"_blank\" rel=\"noopener\">Getting Started</a> page for a quick overview.</p><p>The documentation is divided into several sections:</p><ul><li><a href=\"https://react.dev/learn\" target=\"_blank\" rel=\"noopener\">Quick Start</a></li><li><a href=\"https://react.dev/learn/tutorial-tic-tac-toe\" target=\"_blank\" rel=\"noopener\">Tutorial</a></li><li><a href=\"https://react.dev/learn/thinking-in-react\" target=\"_blank\" rel=\"noopener\">Thinking in React</a></li><li><a href=\"https://react.dev/learn/installation\" target=\"_blank\" rel=\"noopener\">Installation</a></li><li><a href=\"https://react.dev/learn/describing-the-ui\" target=\"_blank\" rel=\"noopener\">Describing the UI</a></li><li><a href=\"https://react.dev/learn/adding-interactivity\" target=\"_blank\" rel=\"noopener\">Adding Interactivity</a></li><li><a href=\"https://react.dev/learn/managing-state\" target=\"_blank\" rel=\"noopener\">Managing State</a></li><li><a href=\"https://react.dev/learn/escape-hatches\" target=\"_blank\" rel=\"noopener\">Advanced Guides</a></li><li><a href=\"https://react.dev/reference/react\" target=\"_blank\" rel=\"noopener\">API Reference</a></li><li><a href=\"https://react.dev/community\" target=\"_blank\" rel=\"noopener\">Where to Get Support</a></li><li><a href=\"https://legacy.reactjs.org/docs/how-to-contribute.html\" target=\"_blank\" rel=\"noopener\">Contributing Guide</a></li></ul><p>You can improve it by sending pull requests to <a href=\"https://github.com/reactjs/react.dev\" target=\"_blank\" rel=\"noopener\">this repository</a>.</p><h2 id=\"Examples\">Examples</h2><p>We have several examples <a href=\"https://react.dev/\" target=\"_blank\" rel=\"noopener\">on the website</a>. Here is the first one to get you started:</p><pre><code>import { createRoot } from &#x27;react-dom/client&#x27;;\n\nfunction HelloMessage({ name }) {\n  return Hello {name};\n}\n\nconst root = createRoot(document.getElementById(&#x27;container&#x27;));\nroot.render();\n</code></pre><p>This example will render &quot;Hello Taylor&quot; into a container on the page.</p><p>You&#x27;ll notice that we used an HTML-like syntax; <a href=\"https://react.dev/learn#writing-markup-with-jsx\" target=\"_blank\" rel=\"noopener\">we call it JSX</a>. JSX is not required to use React, but it makes code more readable, and writing it feels like writing HTML.</p><h2 id=\"Contributing\">Contributing</h2><p>The main purpose of this repository is to continue evolving React core, making it faster and easier to use. Development of React happens in the open on GitHub, and we are grateful to the community for contributing bugfixes and improvements. Read below to learn how you can take part in improving React.</p><h3 id=\"CodeofConduct\"><a href=\"https://code.fb.com/codeofconduct\" target=\"_blank\" rel=\"noopener\">Code of Conduct</a></h3><p>Facebook has adopted a Code of Conduct that we expect project participants to adhere to. Please read <a href=\"https://code.fb.com/codeofconduct\" target=\"_blank\" rel=\"noopener\">the full text</a> so that you can understand what actions will and will not be tolerated.</p><h3 id=\"ContributingGuide\"><a href=\"https://legacy.reactjs.org/docs/how-to-contribute.html\" target=\"_blank\" rel=\"noopener\">Contributing Guide</a></h3><p>Read our <a href=\"https://legacy.reactjs.org/docs/how-to-contribute.html\" target=\"_blank\" rel=\"noopener\">contributing guide</a> to learn about our development process, how to propose bugfixes and improvements, and how to build and test your changes to React.</p><h3 id=\"GoodFirstIssues\"><a href=\"https://github.com/react/react/labels/good%20first%20issue\" target=\"_blank\" rel=\"noopener\">Good First Issues</a></h3><p>To help you get your feet wet and get you familiar with our contribution process, we have a list of <a href=\"https://github.com/react/react/labels/good%20first%20issue\" target=\"_blank\" rel=\"noopener\">good first issues</a> that contain bugs that have a relatively limited scope. This is a great place to get started.</p><h3 id=\"License\">License</h3><p>React is <a href=\"https://github.com/facebook/react/blob/HEAD/./LICENSE\" target=\"_blank\" rel=\"noopener\">MIT licensed</a>.</p></article></div></div><aside><div class=\"side-box toc\" id=\"rmToc\"><h4>本页目录</h4><a class=\"\" href=\"#Installation\">Installation</a><a class=\"\" href=\"#Documentation\">Documentation</a><a class=\"\" href=\"#Examples\">Examples</a><a class=\"\" href=\"#Contributing\">Contributing</a><a class=\"lv3\" href=\"#CodeofConduct\">Code of Conduct</a><a class=\"lv3\" href=\"#ContributingGuide\">Contributing Guide</a><a class=\"lv3\" href=\"#GoodFirstIssues\">Good First Issues</a><a class=\"lv3\" href=\"#License\">License</a></div><div class=\"side-box\"><h4>语言分布</h4><a href=\"ranking.html?tab=lang\">Rust <span style=\"float:right\">4</span></a><a href=\"ranking.html?tab=lang\">Python <span style=\"float:right\">2</span></a><a href=\"ranking.html?tab=lang\">JavaScript <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">Go <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">TypeScript <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">Zig <span style=\"float:right\">1</span></a></div><div class=\"side-box\"><h4>热门主题</h4><a href=\"search.html?q=javascript\">#javascript <span style=\"float:right\">3</span></a><a href=\"search.html?q=rust\">#rust <span style=\"float:right\">3</span></a><a href=\"search.html?q=ui\">#ui <span style=\"float:right\">2</span></a><a href=\"search.html?q=python\">#python <span style=\"float:right\">2</span></a><a href=\"search.html?q=cli\">#cli <span style=\"float:right\">2</span></a><a href=\"search.html?q=awesome\">#awesome <span style=\"float:right\">2</span></a><a href=\"s 11px;font-style:normal;font-weight:600;margin:0 5px 5px 0}\n.pill{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:650;color:var(--muted)}\n.pill.star{color:var(--warn);background:color-mix(in srgb,#f59e0b 10%,var(--card));border-color:color-mix(in srgb,#f59e0b 25%,var(--line))}\n/* 侧栏 */\naside{position:sticky;top:84px;min-width:0}\n.side-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;margin-bottom:14px;box-shadow:var(--shadow)}\n.side-box h4{font-size:13px;font-weight:720;margin-bottom:12px;display:flex;align-items:center;gap:7px}\n.side-box h4:before{content:\"\";width:3px;height:14px;border-radius:2px;background:linear-gradient(var(--brand),var(--brand2))}\n.side-box a{display:block;font-size:12.5px;padding:6px 0;color:var(--muted);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}\n.side-box a:last-child{border-bottom:0}.side-box a:hover{color:var(--brand);text-decoration:none}\n.side-box a span{float:right;color:var(--muted);font-variant-numeric:tabular-nums}\n.toc a{display:block;font-size:12.5px;color:var(--muted);padding:4px 0 4px 10px;border-left:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.toc a:hover,.toc a.on{border-left-color:var(--brand);color:var(--brand);text-decoration:none}\n.toc a.lv3{padding-left:22px;font-size:12px}\n/* Tab / 榜单 */\n.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:550;cursor:pointer;color:var(--muted);transition:.16s}\n.tabs button:hover{border-color:var(--brand);color:var(--brand)}.tabs button.on{background:linear-gradient(135deg,#6366f1,#7c5cf0);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(99,102,241,.25)}\n.rank-row{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 16px;margin-bottom:9px;box-shadow:var(--shadow);transition:.16s;min-width:0}\n.rank-row:hover{border-color:var(--brand);transform:translateX(2px)}\n.rank-row .no{width:30px;flex:none;text-align:center;font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}\n.rank-row .no.g{color:#fff;background:linear-gradient(135deg,#f5b942,#e0951a);border-radius:8px;padding:2px 0}\n.rank-row .no.s{color:#fff;background:linear-gradient(135deg,#9aa6b8,#78859a);border-radius:8px;padding:2px 0}\n.rank-row .no.b{color:#fff;background:linear-gradient(135deg,#cd8b5b,#a96a3c);border-radius:8px;padding:2px 0}\n.rank-row .bd{flex:1;min-width:0}.rank-row .bd b{font-size:14px}.rank-row .bd span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.rank-row .st{flex:none;font-size:12.5px;font-weight:700;color:var(--warn)}\n/* 广告 */\n.ad{background:linear-gradient(135deg,color-mix(in srgb,var(--soft) 55%,var(--card)),var(--card));border:1px dashed color-mix(in srgb,var(--brand) 28%,var(--line));border-radius:var(--radius);padding:14px 17px;margin:14px 0}\n.ad[hidden]{display:none}.ad-hd span{font-size:10.5px;letter-spacing:.6px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}\n.ad-v[hidden]{display:none}.ad-v h4{font-size:14px;margin:8px 0 3px;font-weight:700}.ad-v p{font-size:12.5px;color:var(--muted)}.ad-cta{display:inline-block;margin-top:8px;font-size:12px;font-weight:700}\n/* README 排版 */\n.rm-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;padding:13px 20px;border-bottom:0;margin-top:0}\n.rm-bar b{font-size:14px;font-weight:720;display:flex;align-items:center;gap:8px}\n.rm-bar b:before{content:\"\";width:3px;height:15px;border-radius:2px;background:linear-gradient(var(--brand),var(--brand2))}\n.md{background:var(--card);border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);padding:26px 30px;box-shadow:var(--shadow);line-height:1.85;overflow-wrap:anywhere;word-break:break-word;font-size:14px}\n.md-clip .md{border-top:0}\n.md h1,.md h2,.md h3,.md h4{margin:24px 0 12px;line-height:1.35;font-weight:750;letter-spacing:-.3px;scroll-margin-top:80px}\n.md h1{font-size:27px;margin-top:4px}.md h1:first-child{margin-top:0}\n.md h2{font-size:21px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-top:30px}\n.md h3{font-size:17px}.md h4{font-size:15px}\n.md>p:first-child{margin-top:0}\n.md p{margin:11px 0}.md ul,.md ol{padding-left:24px;margin:11px 0}.md li{margin:4px 0}\n.md a{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--brand) 35%,transparent);text-underline-offset:2px}\n.md code{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\n.md pre{background:#111626;color:#e6edf7;border:1px solid #232a3d;border-radius:11px;padding:15px 17px;overflow:auto;margin:14px 0;line-height:1.6}\nhtml[data-theme=light] .md pre{background:#12162a}\n.md pre code{border:0;background:none;padding:0;color:inherit;font-size:12.5px}\n.md img{max-width:100%;height:auto;border-radius:10px;margin:8px 0}\n.md blockquote{border-left:3px solid var(--brand);background:var(--soft);padding:9px 15px;border-radius:0 9px 9px 0;color:var(--muted);margin:13px 0}\n.md hr{border:0;border-top:1px solid var(--line);margin:22px 0}\n.md table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;display:block;overflow-x:auto}\n.md th,.md td{border:1px solid var(--line);padding:8px 11px;text-align:left;white-space:nowrap}\n.md th{background:var(--bg2);font-weight:700}\n.md tr:nth-child(even) td{background:color-mix(in srgb,var(--bg2) 45%,var(--card))}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--card);padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}.seg button.on{background:var(--brand);color:#fff}\n/* 长文折叠 */\n.md-clip{position:relative;margin-top:0}\n.md-clip.collapsed>.md{max-height:760px;overflow:hidden}\n.md-clip.collapsed:after{content:\"\";position:absolute;left:1px;right:1px;bottom:38px;height:120px;pointer-events:none;background:linear-gradient(transparent,var(--card))}\n.rm-more{display:flex;justify-content:center;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);background:var(--card);padding:11px;position:relative;z-index:2}\n.rm-more button{border:0;background:var(--soft);color:var(--brand);font-weight:700;font-size:12.5px;padding:7px 18px;border-radius:9px;cursor:pointer}\n/* 下载 / 评论区 */\n.proxy-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 16px;padding:10px 13px;background:var(--bg);border:1px solid var(--line);border-radius:10px}\n.proxy-bar label{font-size:12.5px;font-weight:700}\n.proxy-bar select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:12.5px}\n.proxy-bar .hint{font-size:11.5px;color:var(--muted);margin:0}\n.md-img{max-width:100%;height:auto}\n.asset{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin:9px 0;background:var(--bg)}.asset .f{flex:1;min-width:0;font-size:13px;font-weight:600;overflow-wrap:anywhere}.asset .f small{display:block;color:var(--muted);font-weight:400}\n.comm{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}\n.comm h2{font-size:16px;font-weight:720}.comm-hint{font-size:12.5px;color:var(--muted);margin:6px 0 13px}\n/* 表单 / 页脚 */\n.form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);max-width:620px}\n.form label{display:block;font-size:13px;font-weight:680;margin:16px 0 7px}.form label b{color:var(--warn)}\n.form input,.form textarea,.form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:13.5px;transition:.16s}\n.form input:focus,.form textarea:focus,.form select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--soft);background:var(--card)}\n.form textarea{min-height:110px;resize:vertical}.form .hint{font-size:11.5px;color:var(--muted);margin-top:5px}\n.form .acts{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}.form .msg{margin-top:14px;font-size:13px}\nfooter{border-top:1px solid var(--line);background:var(--card);padding:24px 0;margin-top:20px;font-size:12.5px;color:var(--muted)}\nfooter .r{float:right;display:flex;gap:16px}\n.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}\n.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}\n@media(max-width:640px){.hero h1{font-size:27px}.srch input{width:138px}.srch .pop{width:290px}.wrap{padding:0 16px}.md{padding:18px}.md h1{font-size:22px}.md h2{font-size:18px}footer .r{float:none;margin-top:8px}}\n#waline{margin-top:14px}\nhtml[data-theme=dark]{--waline-bg-color:#151a27;--waline-text-color:#e9edf7;--waline-border-color:#2a3142;--waline-primary-color:#8b8bf0;--waline-bg-color-light:#1c2333}</style></head><body><header><div class=\"wrap hd\"><a class=\"logo\" href=\"index.html\"><i>✦</i>OpenPick</a><nav><a href=\"index.html\">发现</a><a href=\"ranking.html\">榜单</a><a href=\"search.html\">搜索</a><a href=\"submit.html\">提交项目</a></nav><div class=\"hd-r\"><div class=\"srch\"><input type=\"text\" placeholder=\"搜索项目 / 主题…\" autocomplete=\"off\"><div class=\"pop\"></div></div><a class=\"lnk\" href=\"../en/p-gh-astral-sh-uv.html\">EN</a><button class=\"btn\" id=\"themeBtn\">☾</button></div></div></header><main class=\"wrap\"><div style=\"padding:26px 0 12px\"><a href=\"../index.html\">← 返回列表</a></div><div class=\"cols\"><div><div class=\"card\" style=\"margin-bottom:18px;padding:22px 24px\"><h3 style=\"font-size:23px;letter-spacing:-.5px\">astral-sh/uv</h3><span class=\"note\">把 Python 依赖安装从几十秒压到一秒内，几乎无损替换 pip。</span><p>An extremely fast Python package installer and resolver</p><div><i class=\"tg\">#python</i><i class=\"tg\">#packaging</i><i class=\"tg\">#rust</i></div><div class=\"meta\" style=\"margin-top:12px\"><span class=\"pill star\">★ 42.0k</span><span>Rust</span><span>更新 2026-11-13</span><span>难度 入门</span></div><div class=\"acts\" style=\"margin-top:16px;display:flex;gap:8px\"><a class=\"btn btn-p\" href=\"https://github.com/astral-sh/uv\" target=\"_blank\" rel=\"noopener\">GitHub ↗</a><button class=\"btn\" data-copy=\"https://YOUR_DOMAIN/zh/p-gh-astral-sh-uv.html\">复制链接</button></div></div><div class=\"rm-bar\"><b>项目说明</b></div><div class=\"md-clip collapsed\" id=\"clip-mdBody\"><article class=\"md\" id=\"mdBody\"><h1 id=\"uv\">uv</h1><p><img class=\"md-img\" src=\"https://img.shields.io/pypi/v/uv.svg\" alt=\"Latest PyPI version\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://img.shields.io/pypi/v/uv.svg\"> <img class=\"md-img\" src=\"https://img.shields.io/pypi/pyversions/uv.svg\" alt=\"Supported Python versions\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://img.shields.io/pypi/pyversions/uv.svg\"> <img class=\"md-img\" src=\"https://img.shields.io/badge/Discord-%235865F2.svg?logo=discord&amp;logoColor=white\" alt=\"Discord\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://img.shields.io/badge/Discord-%235865F2.svg?logo=discord&amp;logoColor=white\"></p><p>An extremely fast Python package and project manager, written in Rust.</p><p><img class=\"md-img\" src=\"https://github.com/astral-sh/uv/assets/1309177/629e59c0-9c6e-4013-9ad4-adb2bcf5080d\" alt=\"Shows a bar chart with benchmark results.\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://github.com/astral-sh/uv/assets/1309177/629e59c0-9c6e-4013-9ad4-adb2bcf5080d\"></p><p>Installing <a href=\"https://trio.readthedocs.io/\" target=\"_blank\" rel=\"noopener\">Trio</a>&#x27;s dependencies with a warm cache.</p><h2 id=\"Highlights\">Highlights</h2><ul><li>A single tool to replace <code>pip</code>, <code>pip-tools</code>, <code>pipx</code>, <code>poetry</code>, <code>pyenv</code>, <code>twine</code>, <code>virtualenv</code>, and more.</li><li><a href=\"https://github.com/astral-sh/uv/blob/main/BENCHMARKS.md\" target=\"_blank\" rel=\"noopener\">10-100x faster</a> than <code>pip</code>.</li><li>Provides <a href=\"#projects\">comprehensive project management</a>, with a <a href=\"https://docs.astral.sh/uv/concepts/projects/layout#the-lockfile\" target=\"_blank\" rel=\"noopener\">universal lockfile</a>.</li><li><a href=\"#scripts\">Runs scripts</a>, with support for <a href=\"https://docs.astral.sh/uv/guides/scripts#declaring-script-dependencies\" target=\"_blank\" rel=\"noopener\">inline dependency metadata</a>.</li><li><a href=\"#python-versions\">Installs and manages</a> Python versions.</li><li><a href=\"#tools\">Runs and installs</a> tools published as Python packages.</li><li>Includes a <a href=\"#the-pip-interface\">pip-compatible interface</a> for a performance boost with a familiar CLI.</li><li>Supports Cargo-style <a href=\"https://docs.astral.sh/uv/concepts/projects/workspaces\" target=\"_blank\" rel=\"noopener\">workspaces</a> for scalable projects.</li><li>Disk-space efficient, with a <a href=\"https://docs.astral.sh/uv/concepts/cache\" target=\"_blank\" rel=\"noopener\">global cache</a> for dependency deduplication.</li><li>Installable without Rust or Python via <code>curl</code> or <code>pip</code>.</li><li>Supports macOS, Linux, and Windows.</li></ul><p>uv is backed by <a href=\"https://astral.sh\" target=\"_blank\" rel=\"noopener\">Astral</a>, the creators of <a href=\"https://github.com/astral-sh/ruff\" target=\"_blank\" rel=\"noopener\">Ruff</a> and <a href=\"https://github.com/astral-sh/ty\" target=\"_blank\" rel=\"noopener\">ty</a>.</p><h2 id=\"Installation\">Installation</h2><p>Install uv with our standalone installers:</p><pre><code># On macOS and Linux.\ncurl -LsSf https://astral.sh/uv/install.sh | sh\n</code></pre><pre><code># On Windows.\npowershell -ExecutionPolicy ByPass -c &quot;irm https://astral.sh/uv/install.ps1 | iex&quot;\n</code></pre><p>Or, from <a href=\"https://pypi.org/project/uv/\" target=\"_blank\" rel=\"noopener\">PyPI</a>:</p><pre><code># With pip.\npip install uv\n</code></pre><pre><code># Or pipx.\npipx install uv\n</code></pre><p>If installed via the standalone installer, uv can update itself to the latest version:</p><pre><code>uv self update\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/getting-started/installation/\" target=\"_blank\" rel=\"noopener\">installation documentation</a> for details and alternative installation methods.</p><h2 id=\"Documentation\">Documentation</h2><p>uv&#x27;s documentation is available at <a href=\"https://docs.astral.sh/uv\" target=\"_blank\" rel=\"noopener\">docs.astral.sh/uv</a>.</p><p>Additionally, the command line reference documentation can be viewed with <code>uv help</code>.</p><h2 id=\"Features\">Features</h2><h3 id=\"Projects\">Projects</h3><p>uv manages project dependencies and environments, with support for lockfiles, workspaces, and more, similar to <code>rye</code> or <code>poetry</code>:</p><pre><code>$ uv init example\nInitialized project `example` at `/home/user/example`\n\n$ cd example\n\n$ uv add ruff\nCreating virtual environment at: .venv\nResolved 2 packages in 170ms\n   Built example @ file:///home/user/example\nPrepared 2 packages in 627ms\nInstalled 2 packages in 1ms\n + example==0.1.0 (from file:///home/user/example)\n + ruff==0.5.0\n\n$ uv run ruff check\nAll checks passed!\n\n$ uv lock\nResolved 2 packages in 0.33ms\n\n$ uv sync\nResolved 2 packages in 0.70ms\nChecked 1 package in 0.02ms\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/guides/projects/\" target=\"_blank\" rel=\"noopener\">project documentation</a> to get started.</p><p>uv also supports building and publishing projects, even if they&#x27;re not managed with uv. See the <a href=\"https://docs.astral.sh/uv/guides/publish/\" target=\"_blank\" rel=\"noopener\">publish guide</a> to learn more.</p><h3 id=\"Scripts\">Scripts</h3><p>uv manages dependencies and environments for single-file scripts.</p><p>Create a new script and add inline metadata declaring its dependencies:</p><pre><code>$ echo &#x27;import requests; print(requests.get(&quot;https://astral.sh&quot;))&#x27; &gt; example.py\n\n$ uv add --script example.py requests\nUpdated `example.py`\n</code></pre><p>Then, run the script in an isolated virtual environment:</p><pre><code>$ uv run example.py\nReading inline script metadata from: example.py\nInstalled 5 packages in 12ms\n\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/guides/scripts/\" target=\"_blank\" rel=\"noopener\">scripts documentation</a> to get started.</p><h3 id=\"Tools\">Tools</h3><p>uv executes and installs command-line tools provided by Python packages, similar to <code>pipx</code>.</p><p>Run a tool in an ephemeral environment using <code>uvx</code> (an alias for <code>uv tool run</code>):</p><pre><code>$ uvx pycowsay &#x27;hello world!&#x27;\nResolved 1 package in 167ms\nInstalled 1 package in 9ms\n + pycowsay==0.0.0.2\n  &quot;&quot;&quot;\n\n  ------------\n&lt; hello world! &gt;\n  ------------\n   \\   ^__^\n    \\  (oo)\\_______\n       (__)\\       )\\/\\\n           ||----w |\n           ||     ||\n</code></pre><p>Install a tool with <code>uv tool install</code>:</p><pre><code>$ uv tool install ruff\nResolved 1 package in 6ms\nInstalled 1 package in 2ms\n + ruff==0.5.0\nInstalled 1 executable: ruff\n\n$ ruff --version\nruff 0.5.0\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/guides/tools/\" target=\"_blank\" rel=\"noopener\">tools documentation</a> to get started.</p><h3 id=\"Pythonversions\">Python versions</h3><p>uv installs Python and allows quickly switching between versions.</p><p>Install multiple Python versions:</p><pre><code>$ uv python install 3.12 3.13 3.14\nInstalled 3 versions in 972ms\n + cpython-3.12.12-macos-aarch64-none (python3.12)\n + cpython-3.13.9-macos-aarch64-none (python3.13)\n + cpython-3.14.0-macos-aarch64-none (python3.14)\n\n</code></pre><p>Download Python versions as needed:</p><pre><code>$ uv venv --python 3.12.0\nUsing Python 3.12.0\nCreating virtual environment at: .venv\nActivate with: source .venv/bin/activate\n\n$ uv run --python pypy@3.8 -- python --version\nPython 3.8.16 (a9dbdca6fc3286b0addd2240f11d97d8e8de187a, Dec 29 2022, 11:45:30)\n[PyPy 7.3.11 with GCC Apple LLVM 13.1.6 (clang-1316.0.21.2.5)] on darwin\nType &quot;help&quot;, &quot;copyright&quot;, &quot;credits&quot; or &quot;license&quot; for more information.\n&gt;&gt;&gt;&gt;\n</code></pre><p>Use a specific Python version in the current directory:</p><pre><code>$ uv python pin 3.11\nPinned `.python-version` to `3.11`\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/guides/install-python/\" target=\"_blank\" rel=\"noopener\">Python installation documentation</a> to get started.</p><h3 id=\"Thepipinterface\">The pip interface</h3><p>uv provides a drop-in replacement for common <code>pip</code>, <code>pip-tools</code>, and <code>virtualenv</code> commands.</p><p>uv extends their interfaces with advanced features, such as dependency version overrides, platform-independent resolutions, reproducible resolutions, alternative resolution strategies, and more.</p><p>Migrate to uv without changing your existing workflows — and experience a 10-100x speedup — with the <code>uv pip</code> interface.</p><p>Compile requirements into a platform-independent requirements file:</p><pre><code>$ uv pip compile requirements.in \\\n   --universal \\\n   --output-file requirements.txt\nResolved 43 packages in 12ms\n</code></pre><p>Create a virtual environment:</p><pre><code>$ uv venv\nUsing Python 3.12.3\nCreating virtual environment at: .venv\nActivate with: source .venv/bin/activate\n</code></pre><p>Install the locked requirements:</p><pre><code>$ uv pip sync requirements.txt\nResolved 43 packages in 11ms\nInstalled 43 packages in 208ms\n + babel==2.15.0\n + black==24.4.2\n + certifi==2024.7.4\n ...\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/pip/index/\" target=\"_blank\" rel=\"noopener\">pip interface documentation</a> to get started.</p><h2 id=\"Contributing\">Contributing</h2><p>We are passionate about supporting contributors of all levels of experience and would love to see you get involved in the project. See the <a href=\"https://github.com/astral-sh/uv?tab=contributing-ov-file#contributing\" target=\"_blank\" rel=\"noopener\">contributing guide</a> to get started.</p><h2 id=\"FAQ\">FAQ</h2><h4 id=\"Howdoyoupronounceuv\">How do you pronounce uv?</h4><p>It&#x27;s pronounced as &quot;you - vee&quot; (<a href=\"https://en.wikipedia.org/wiki/Help:IPA/English#Key\" target=\"_blank\" rel=\"noopener\"><code>/juː viː/</code></a>)</p><h4 id=\"HowshouldIstylizeuv\">How should I stylize uv?</h4><p>Just &quot;uv&quot;, please. See the <a href=\"https://github.com/astral-sh/uv/blob/HEAD/./STYLE.md#styling-uv\" target=\"_blank\" rel=\"noopener\">style guide</a> for details.</p><h4 id=\"Whatplatformsdoesuvsupport\">What platforms does uv support?</h4><p>See uv&#x27;s <a href=\"https://docs.astral.sh/uv/reference/platforms/\" target=\"_blank\" rel=\"noopener\">platform support</a> document.</p><h4 id=\"Isuvreadyforproduction\">Is uv ready for production?</h4><p>Yes, uv is stable and widely used in production. See uv&#x27;s <a href=\"https://docs.astral.sh/uv/reference/versioning/\" target=\"_blank\" rel=\"noopener\">versioning policy</a> document for details.</p><h2 id=\"Acknowledgements\">Acknowledgements</h2><p>uv&#x27;s dependency resolver uses <a href=\"https://github.com/pubgrub-rs/pubgrub\" target=\"_blank\" rel=\"noopener\">PubGrub</a> under the hood. We&#x27;re grateful to the PubGrub maintainers, especially <a href=\"https://github.com/Eh2406\" target=\"_blank\" rel=\"noopener\">Jacob Finkelman</a>, for their support.</p><p>uv&#x27;s Git implementation is based on <a href=\"https://github.com/rust-lang/cargo\" target=\"_blank\" rel=\"noopener\">Cargo</a>.</p><p>Some of uv&#x27;s optimizations are inspired by the great work we&#x27;ve seen in <a href=\"https://pnpm.io/\" target=\"_blank\" rel=\"noopener\">pnpm</a>, <a href=\"https://github.com/orogene/orogene\" target=\"_blank\" rel=\"noopener\">Orogene</a>, and <a href=\"https://github.com/oven-sh/bun\" target=\"_blank\" rel=\"noopener\">Bun</a>. We&#x27;ve also learned a lot from Nathaniel J. Smith&#x27;s <a href=\"https://github.com/njsmith/posy\" target=\"_blank\" rel=\"noopener\">Posy</a> and adapted its <a href=\"https://github.com/njsmith/posy/tree/main/src/trampolines/windows-trampolines/posy-trampoline\" target=\"_blank\" rel=\"noopener\">trampoline</a> for Windows support.</p><h2 id=\"License\">License</h2><p>uv is licensed under either of</p><ul><li>Apache License, Version 2.0, (<a href=\"https://github.com/astral-sh/uv/blob/HEAD/LICENSE-APACHE\" target=\"_blank\" rel=\"noopener\">LICENSE-APACHE</a> or )</li><li>MIT license (<a href=\"https://github.com/astral-sh/uv/blob/HEAD/LICENSE-MIT\" target=\"_blank\" rel=\"noopener\">LICENSE-MIT</a> or )</li></ul><p>at your option.</p><p>Unless you explicitly state otherwise, any contribution intentionally submitted for inclusion in uv by you, as defined in the Apache-2.0 license, shall be dually licensed as above, without any additional terms or conditions.</p><p><img class=\"md-img\" src=\"https://raw.githubusercontent.com/astral-sh/uv/main/assets/svg/Astral.svg\" alt=\"Made by Astral\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://raw.githubusercontent.com/astral-sh/uv/main/assets/svg/Astral.svg\"></p></article><div class=\"rm-more\"><button data-more=\"展开全文 ↓\" data-less=\"收起 ↑\">展开全文 ↓</button></div></div><aside class=\"ad\" data-slot=\"detail_end\"><div class=\"ad-hd\"><span>广告</span></div><div class=\"ad-v\" data-start=\"\" data-end=\"\"><a href=\"submit.html\"><h4>也推荐一个项目？</h4><p>提交后进入人工审核队列。</p><span class=\"ad-cta\">去提交</span></a></div></aside></div><aside><div class=\"side-box toc\" id=\"rmToc\"><h4>本页目录</h4><a class=\"\" href=\"#Highlights\">Highlights</a><a class=\"\" href=\"#Installation\">Installation</a><a class=\"\" href=\"#Documentation\">Documentation</a><a class=\"\" href=\"#Features\">Features</a><a class=\"lv3\" href=\"#Projects\">Projects</a><a class=\"lv3\" href=\"#Scripts\">Scripts</a><a class=\"lv3\" href=\"#Tools\">Tools</a><a class=\"lv3\" href=\"#Pythonversions\">Python versions</a><a class=\"lv3\" href=\"#Thepipinterface\">The pip interface</a><a class=\"\" href=\"#Contributing\">Contributing</a><a class=\"\" href=\"#FAQ\">FAQ</a><a class=\"\" href=\"#Acknowledgements\">Acknowledgements</a><a class=\"\" href=\"#License\">License</a></div><div class=\"side-box\"><h4>语言分布</h4><a href=\"ranking.html?tab=lang\">Rust <span style=\"float:right\">4</span></a><a href=\"ranking.html?tab=lang\">Python <span style=\"float:right\">2</span></a><a href=\"ranking.html?tab=lang\">JavaScript <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">Go <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">TypeScript <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">Zig <span style=\"float:right\">1</span></a></div><div class=\"side-box\"><h4>热门主题</h4><a href=\"search.html?q=javascript\">#javascript <span style=\"float:right\">3</span></a><a href=\"sea ss=\"md-clip\" id=\"clip-mdBody\"><article class=\"md\" id=\"mdBody\"><p>React is a JavaScript library for building user interfaces.</p><ul><li><b>Declarative:</b> React makes it painless to create interactive UIs. Design simple views for each state in your application, and React will efficiently update and render just the right components when your data changes. Declarative views make your code more predictable, simpler to understand, and easier to debug.</li><li><b>Component-Based:</b> Build encapsulated components that manage their own state, then compose them to make complex UIs. Since component logic is written in JavaScript instead of templates, you can easily pass rich data through your app and keep the state out of the DOM.</li><li><b>Learn Once, Write Anywhere:</b> We don&#x27;t make assumptions about the rest of your technology stack, so you can develop new features in React without rewriting existing code. React can also render on the server using <a href=\"https://nodejs.org/en\" target=\"_blank\" rel=\"noopener\">Node</a> and power mobile apps using <a href=\"https://reactnative.dev/\" target=\"_blank\" rel=\"noopener\">React Native</a>.</li></ul><p><a href=\"https://react.dev/learn\" target=\"_blank\" rel=\"noopener\">Learn how to use React in your project</a>.</p><h2 id=\"Installation\">Installation</h2><p>React has been designed for gradual adoption from the start, and <b>you can use as little or as much React as you need</b>:</p><ul><li>Use <a href=\"https://react.dev/learn\" target=\"_blank\" rel=\"noopener\">Quick Start</a> to get a taste of React.</li><li><a href=\"https://react.dev/learn/add-react-to-an-existing-project\" target=\"_blank\" rel=\"noopener\">Add React to an Existing Project</a> to use as little or as much React as you need.</li><li><a href=\"https://react.dev/learn/start-a-new-react-project\" target=\"_blank\" rel=\"noopener\">Create a New React App</a> if you&#x27;re looking for a powerful JavaScript toolchain.</li></ul><h2 id=\"Documentation\">Documentation</h2><p>You can find the React documentation <a href=\"https://react.dev/\" target=\"_blank\" rel=\"noopener\">on the website</a>.</p><p>Check out the <a href=\"https://react.dev/learn\" target=\"_blank\" rel=\"noopener\">Getting Started</a> page for a quick overview.</p><p>The documentation is divided into several sections:</p><ul><li><a href=\"https://react.dev/learn\" target=\"_blank\" rel=\"noopener\">Quick Start</a></li><li><a href=\"https://react.dev/learn/tutorial-tic-tac-toe\" target=\"_blank\" rel=\"noopener\">Tutorial</a></li><li><a href=\"https://react.dev/learn/thinking-in-react\" target=\"_blank\" rel=\"noopener\">Thinking in React</a></li><li><a href=\"https://react.dev/learn/installation\" target=\"_blank\" rel=\"noopener\">Installation</a></li><li><a href=\"https://react.dev/learn/describing-the-ui\" target=\"_blank\" rel=\"noopener\">Describing the UI</a></li><li><a href=\"https://react.dev/learn/adding-interactivity\" target=\"_blank\" rel=\"noopener\">Adding Interactivity</a></li><li><a href=\"https://react.dev/learn/managing-state\" target=\"_blank\" rel=\"noopener\">Managing State</a></li><li><a href=\"https://react.dev/learn/escape-hatches\" target=\"_blank\" rel=\"noopener\">Advanced Guides</a></li><li><a href=\"https://react.dev/reference/react\" target=\"_blank\" rel=\"noopener\">API Reference</a></li><li><a href=\"https://react.dev/community\" target=\"_blank\" rel=\"noopener\">Where to Get Support</a></li><li><a href=\"https://legacy.reactjs.org/docs/how-to-contribute.html\" target=\"_blank\" rel=\"noopener\">Contributing Guide</a></li></ul><p>You can improve it by sending pull requests to <a href=\"https://github.com/reactjs/react.dev\" target=\"_blank\" rel=\"noopener\">this repository</a>.</p><h2 id=\"Examples\">Examples</h2><p>We have several examples <a href=\"https://react.dev/\" target=\"_blank\" rel=\"noopener\">on the website</a>. Here is the first one to get you started:</p><pre><code>import { createRoot } from &#x27;react-dom/client&#x27;;\n\nfunction HelloMessage({ name }) {\n  return Hello {name};\n}\n\nconst root = createRoot(document.getElementById(&#x27;container&#x27;));\nroot.render();\n</code></pre><p>This example will render &quot;Hello Taylor&quot; into a container on the page.</p><p>You&#x27;ll notice that we used an HTML-like syntax; <a href=\"https://react.dev/learn#writing-markup-with-jsx\" target=\"_blank\" rel=\"noopener\">we call it JSX</a>. JSX is not required to use React, but it makes code more readable, and writing it feels like writing HTML.</p><h2 id=\"Contributing\">Contributing</h2><p>The main purpose of this repository is to continue evolving React core, making it faster and easier to use. Development of React happens in the open on GitHub, and we are grateful to the community for contributing bugfixes and improvements. Read below to learn how you can take part in improving React.</p><h3 id=\"CodeofConduct\"><a href=\"https://code.fb.com/codeofconduct\" target=\"_blank\" rel=\"noopener\">Code of Conduct</a></h3><p>Facebook has adopted a Code of Conduct that we expect project participants to adhere to. Please read <a href=\"https://code.fb.com/codeofconduct\" target=\"_blank\" rel=\"noopener\">the full text</a> so that you can understand what actions will and will not be tolerated.</p><h3 id=\"ContributingGuide\"><a href=\"https://legacy.reactjs.org/docs/how-to-contribute.html\" target=\"_blank\" rel=\"noopener\">Contributing Guide</a></h3><p>Read our <a href=\"https://legacy.reactjs.org/docs/how-to-contribute.html\" target=\"_blank\" rel=\"noopener\">contributing guide</a> to learn about our development process, how to propose bugfixes and improvements, and how to build and test your changes to React.</p><h3 id=\"GoodFirstIssues\"><a href=\"https://github.com/react/react/labels/good%20first%20issue\" target=\"_blank\" rel=\"noopener\">Good First Issues</a></h3><p>To help you get your feet wet and get you familiar with our contribution process, we have a list of <a href=\"https://github.com/react/react/labels/good%20first%20issue\" target=\"_blank\" rel=\"noopener\">good first issues</a> that contain bugs that have a relatively limited scope. This is a great place to get started.</p><h3 id=\"License\">License</h3><p>React is <a href=\"https://github.com/facebook/react/blob/HEAD/./LICENSE\" target=\"_blank\" rel=\"noopener\">MIT licensed</a>.</p></article></div></div><aside><div class=\"side-box toc\" id=\"rmToc\"><h4>On this page</h4><a class=\"\" href=\"#Installation\">Installation</a><a class=\"\" href=\"#Documentation\">Documentation</a><a class=\"\" href=\"#Examples\">Examples</a><a class=\"\" href=\"#Contributing\">Contributing</a><a class=\"lv3\" href=\"#CodeofConduct\">Code of Conduct</a><a class=\"lv3\" href=\"#ContributingGuide\">Contributing Guide</a><a class=\"lv3\" href=\"#GoodFirstIssues\">Good First Issues</a><a class=\"lv3\" href=\"#License\">License</a></div><div class=\"side-box\"><h4>By language</h4><a href=\"ranking.html?tab=lang\">Rust <span style=\"float:right\">4</span></a><a href=\"ranking.html?tab=lang\">Python <span style=\"float:right\">2</span></a><a href=\"ranking.html?tab=lang\">JavaScript <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">Go <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">TypeScript <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">Zig <span style=\"float:right\">1</span></a></div><div class=\"side-box\"><h4>Popular topics</h4><a href=\"search.html?q=javascript\">#javascript <span style=\"float:right\">3</span></a><a href=\"search.html?q=rust\">#rust <span style=\"float:right\">3</span></a><a href=\"search.html?q=ui\">#ui <span style=\"float:right\">2</span></a><a href=\"search.html?q=python\">#python <span style=\"float:right\">2</span></a><a href=\"search.html?q=cli\">#cli <span style=\"float:right\">2</span></a><a href=\"search.html?q=awesome\">#awesome <span style=\"float:rig n:left;white-space:nowrap}\n.md th{background:var(--bg2);font-weight:700}\n.md tr:nth-child(even) td{background:color-mix(in srgb,var(--bg2) 45%,var(--card))}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--card);padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}.seg button.on{background:var(--brand);color:#fff}\n/* 长文折叠 */\n.md-clip{position:relative;margin-top:0}\n.md-clip.collapsed>.md{max-height:760px;overflow:hidden}\n.md-clip.collapsed:after{content:\"\";position:absolute;left:1px;right:1px;bottom:38px;height:120px;pointer-events:none;background:linear-gradient(transparent,var(--card))}\n.rm-more{display:flex;justify-content:center;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);background:var(--card);padding:11px;position:relative;z-index:2}\n.rm-more button{border:0;background:var(--soft);color:var(--brand);font-weight:700;font-size:12.5px;padding:7px 18px;border-radius:9px;cursor:pointer}\n/* 下载 / 评论区 */\n.proxy-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 16px;padding:10px 13px;background:var(--bg);border:1px solid var(--line);border-radius:10px}\n.proxy-bar label{font-size:12.5px;font-weight:700}\n.proxy-bar select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:12.5px}\n.proxy-bar .hint{font-size:11.5px;color:var(--muted);margin:0}\n.md-img{max-width:100%;height:auto}\n.asset{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin:9px 0;background:var(--bg)}.asset .f{flex:1;min-width:0;font-size:13px;font-weight:600;overflow-wrap:anywhere}.asset .f small{display:block;color:var(--muted);font-weight:400}\n.comm{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}\n.comm h2{font-size:16px;font-weight:720}.comm-hint{font-size:12.5px;color:var(--muted);margin:6px 0 13px}\n/* 表单 / 页脚 */\n.form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);max-width:620px}\n.form label{display:block;font-size:13px;font-weight:680;margin:16px 0 7px}.form label b{color:var(--warn)}\n.form input,.form textarea,.form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:13.5px;transition:.16s}\n.form input:focus,.form textarea:focus,.form select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--soft);background:var(--card)}\n.form textarea{min-height:110px;resize:vertical}.form .hint{font-size:11.5px;color:var(--muted);margin-top:5px}\n.form .acts{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}.form .msg{margin-top:14px;font-size:13px}\nfooter{border-top:1px solid var(--line);background:var(--card);padding:24px 0;margin-top:20px;font-size:12.5px;color:var(--muted)}\nfooter .r{float:right;display:flex;gap:16px}\n.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}\n.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}\n@media(max-width:640px){.hero h1{font-size:27px}.srch input{width:138px}.srch .pop{width:290px}.wrap{padding:0 16px}.md{padding:18px}.md h1{font-size:22px}.md h2{font-size:18px}footer .r{float:none;margin-top:8px}}\n#waline{margin-top:14px}\nhtml[data-theme=dark]{--waline-bg-color:#151a27;--waline-text-color:#e9edf7;--waline-border-color:#2a3142;--waline-primary-color:#8b8bf0;--waline-bg-color-light:#1c2333}</style></head><body><header><div class=\"wrap hd\"><a class=\"logo\" href=\"index.html\"><i>✦</i>OpenPick</a><nav><a href=\"index.html\">Discover</a><a href=\"ranking.html\">Rankings</a><a href=\"search.html\">Search</a><a href=\"submit.html\">Submit</a></nav><div class=\"hd-r\"><div class=\"srch\"><input type=\"text\" placeholder=\"Search projects / topics…\" autocomplete=\"off\"><div class=\"pop\"></div></div><a class=\"lnk\" href=\"../zh/p-gh-astral-sh-uv.html\">中文</a><button class=\"btn\" id=\"themeBtn\">☾</button></div></div></header><main class=\"wrap\"><div style=\"padding:26px 0 12px\"><a href=\"../index.html\">← Back</a></div><div class=\"cols\"><div><div class=\"card\" style=\"margin-bottom:18px;padding:22px 24px\"><h3 style=\"font-size:23px;letter-spacing:-.5px\">astral-sh/uv</h3><span class=\"note\">Python packaging at Rust speed — a near drop-in pip replacement.</span><p>An extremely fast Python package installer and resolver</p><div><i class=\"tg\">#python</i><i class=\"tg\">#packaging</i><i class=\"tg\">#rust</i></div><div class=\"meta\" style=\"margin-top:12px\"><span class=\"pill star\">★ 42.0k</span><span>Rust</span><span>Updated 2026-11-13</span><span>Difficulty Beginner</span></div><div class=\"acts\" style=\"margin-top:16px;display:flex;gap:8px\"><a class=\"btn btn-p\" href=\"https://github.com/astral-sh/uv\" target=\"_blank\" rel=\"noopener\">GitHub ↗</a><button class=\"btn\" data-copy=\"https://YOUR_DOMAIN/en/p-gh-astral-sh-uv.html\">Copy link</button></div></div><div class=\"rm-bar\"><b>README</b></div><div class=\"md-clip collapsed\" id=\"clip-mdBody\"><article class=\"md\" id=\"mdBody\"><h1 id=\"uv\">uv</h1><p><img class=\"md-img\" src=\"https://img.shields.io/pypi/v/uv.svg\" alt=\"Latest PyPI version\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://img.shields.io/pypi/v/uv.svg\"> <img class=\"md-img\" src=\"https://img.shields.io/pypi/pyversions/uv.svg\" alt=\"Supported Python versions\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://img.shields.io/pypi/pyversions/uv.svg\"> <img class=\"md-img\" src=\"https://img.shields.io/badge/Discord-%235865F2.svg?logo=discord&amp;logoColor=white\" alt=\"Discord\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://img.shields.io/badge/Discord-%235865F2.svg?logo=discord&amp;logoColor=white\"></p><p>An extremely fast Python package and project manager, written in Rust.</p><p><img class=\"md-img\" src=\"https://github.com/astral-sh/uv/assets/1309177/629e59c0-9c6e-4013-9ad4-adb2bcf5080d\" alt=\"Shows a bar chart with benchmark results.\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://github.com/astral-sh/uv/assets/1309177/629e59c0-9c6e-4013-9ad4-adb2bcf5080d\"></p><p>Installing <a href=\"https://trio.readthedocs.io/\" target=\"_blank\" rel=\"noopener\">Trio</a>&#x27;s dependencies with a warm cache.</p><h2 id=\"Highlights\">Highlights</h2><ul><li>A single tool to replace <code>pip</code>, <code>pip-tools</code>, <code>pipx</code>, <code>poetry</code>, <code>pyenv</code>, <code>twine</code>, <code>virtualenv</code>, and more.</li><li><a href=\"https://github.com/astral-sh/uv/blob/main/BENCHMARKS.md\" target=\"_blank\" rel=\"noopener\">10-100x faster</a> than <code>pip</code>.</li><li>Provides <a href=\"#projects\">comprehensive project management</a>, with a <a href=\"https://docs.astral.sh/uv/concepts/projects/layout#the-lockfile\" target=\"_blank\" rel=\"noopener\">universal lockfile</a>.</li><li><a href=\"#scripts\">Runs scripts</a>, with support for <a href=\"https://docs.astral.sh/uv/guides/scripts#declaring-script-dependencies\" target=\"_blank\" rel=\"noopener\">inline dependency metadata</a>.</li><li><a href=\"#python-versions\">Installs and manages</a> Python versions.</li><li><a href=\"#tools\">Runs and installs</a> tools published as Python packages.</li><li>Includes a <a href=\"#the-pip-interface\">pip-compatible interface</a> for a performance boost with a familiar CLI.</li><li>Supports Cargo-style <a href=\"https://docs.astral.sh/uv/concepts/projects/workspaces\" target=\"_blank\" rel=\"noopener\">workspaces</a> for scalable projects.</li><li>Disk-space efficient, with a <a href=\"https://docs.astral.sh/uv/concepts/cache\" target=\"_blank\" rel=\"noopener\">global cache</a> for dependency deduplication.</li><li>Installable without Rust or Python via <code>curl</code> or <code>pip</code>.</li><li>Supports macOS, Linux, and Windows.</li></ul><p>uv is backed by <a href=\"https://astral.sh\" target=\"_blank\" rel=\"noopener\">Astral</a>, the creators of <a href=\"https://github.com/astral-sh/ruff\" target=\"_blank\" rel=\"noopener\">Ruff</a> and <a href=\"https://github.com/astral-sh/ty\" target=\"_blank\" rel=\"noopener\">ty</a>.</p><h2 id=\"Installation\">Installation</h2><p>Install uv with our standalone installers:</p><pre><code># On macOS and Linux.\ncurl -LsSf https://astral.sh/uv/install.sh | sh\n</code></pre><pre><code># On Windows.\npowershell -ExecutionPolicy ByPass -c &quot;irm https://astral.sh/uv/install.ps1 | iex&quot;\n</code></pre><p>Or, from <a href=\"https://pypi.org/project/uv/\" target=\"_blank\" rel=\"noopener\">PyPI</a>:</p><pre><code># With pip.\npip install uv\n</code></pre><pre><code># Or pipx.\npipx install uv\n</code></pre><p>If installed via the standalone installer, uv can update itself to the latest version:</p><pre><code>uv self update\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/getting-started/installation/\" target=\"_blank\" rel=\"noopener\">installation documentation</a> for details and alternative installation methods.</p><h2 id=\"Documentation\">Documentation</h2><p>uv&#x27;s documentation is available at <a href=\"https://docs.astral.sh/uv\" target=\"_blank\" rel=\"noopener\">docs.astral.sh/uv</a>.</p><p>Additionally, the command line reference documentation can be viewed with <code>uv help</code>.</p><h2 id=\"Features\">Features</h2><h3 id=\"Projects\">Projects</h3><p>uv manages project dependencies and environments, with support for lockfiles, workspaces, and more, similar to <code>rye</code> or <code>poetry</code>:</p><pre><code>$ uv init example\nInitialized project `example` at `/home/user/example`\n\n$ cd example\n\n$ uv add ruff\nCreating virtual environment at: .venv\nResolved 2 packages in 170ms\n   Built example @ file:///home/user/example\nPrepared 2 packages in 627ms\nInstalled 2 packages in 1ms\n + example==0.1.0 (from file:///home/user/example)\n + ruff==0.5.0\n\n$ uv run ruff check\nAll checks passed!\n\n$ uv lock\nResolved 2 packages in 0.33ms\n\n$ uv sync\nResolved 2 packages in 0.70ms\nChecked 1 package in 0.02ms\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/guides/projects/\" target=\"_blank\" rel=\"noopener\">project documentation</a> to get started.</p><p>uv also supports building and publishing projects, even if they&#x27;re not managed with uv. See the <a href=\"https://docs.astral.sh/uv/guides/publish/\" target=\"_blank\" rel=\"noopener\">publish guide</a> to learn more.</p><h3 id=\"Scripts\">Scripts</h3><p>uv manages dependencies and environments for single-file scripts.</p><p>Create a new script and add inline metadata declaring its dependencies:</p><pre><code>$ echo &#x27;import requests; print(requests.get(&quot;https://astral.sh&quot;))&#x27; &gt; example.py\n\n$ uv add --script example.py requests\nUpdated `example.py`\n</code></pre><p>Then, run the script in an isolated virtual environment:</p><pre><code>$ uv run example.py\nReading inline script metadata from: example.py\nInstalled 5 packages in 12ms\n\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/guides/scripts/\" target=\"_blank\" rel=\"noopener\">scripts documentation</a> to get started.</p><h3 id=\"Tools\">Tools</h3><p>uv executes and installs command-line tools provided by Python packages, similar to <code>pipx</code>.</p><p>Run a tool in an ephemeral environment using <code>uvx</code> (an alias for <code>uv tool run</code>):</p><pre><code>$ uvx pycowsay &#x27;hello world!&#x27;\nResolved 1 package in 167ms\nInstalled 1 package in 9ms\n + pycowsay==0.0.0.2\n  &quot;&quot;&quot;\n\n  ------------\n&lt; hello world! &gt;\n  ------------\n   \\   ^__^\n    \\  (oo)\\_______\n       (__)\\       )\\/\\\n           ||----w |\n           ||     ||\n</code></pre><p>Install a tool with <code>uv tool install</code>:</p><pre><code>$ uv tool install ruff\nResolved 1 package in 6ms\nInstalled 1 package in 2ms\n + ruff==0.5.0\nInstalled 1 executable: ruff\n\n$ ruff --version\nruff 0.5.0\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/guides/tools/\" target=\"_blank\" rel=\"noopener\">tools documentation</a> to get started.</p><h3 id=\"Pythonversions\">Python versions</h3><p>uv installs Python and allows quickly switching between versions.</p><p>Install multiple Python versions:</p><pre><code>$ uv python install 3.12 3.13 3.14\nInstalled 3 versions in 972ms\n + cpython-3.12.12-macos-aarch64-none (python3.12)\n + cpython-3.13.9-macos-aarch64-none (python3.13)\n + cpython-3.14.0-macos-aarch64-none (python3.14)\n\n</code></pre><p>Download Python versions as needed:</p><pre><code>$ uv venv --python 3.12.0\nUsing Python 3.12.0\nCreating virtual environment at: .venv\nActivate with: source .venv/bin/activate\n\n$ uv run --python pypy@3.8 -- python --version\nPython 3.8.16 (a9dbdca6fc3286b0addd2240f11d97d8e8de187a, Dec 29 2022, 11:45:30)\n[PyPy 7.3.11 with GCC Apple LLVM 13.1.6 (clang-1316.0.21.2.5)] on darwin\nType &quot;help&quot;, &quot;copyright&quot;, &quot;credits&quot; or &quot;license&quot; for more information.\n&gt;&gt;&gt;&gt;\n</code></pre><p>Use a specific Python version in the current directory:</p><pre><code>$ uv python pin 3.11\nPinned `.python-version` to `3.11`\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/guides/install-python/\" target=\"_blank\" rel=\"noopener\">Python installation documentation</a> to get started.</p><h3 id=\"Thepipinterface\">The pip interface</h3><p>uv provides a drop-in replacement for common <code>pip</code>, <code>pip-tools</code>, and <code>virtualenv</code> commands.</p><p>uv extends their interfaces with advanced features, such as dependency version overrides, platform-independent resolutions, reproducible resolutions, alternative resolution strategies, and more.</p><p>Migrate to uv without changing your existing workflows — and experience a 10-100x speedup — with the <code>uv pip</code> interface.</p><p>Compile requirements into a platform-independent requirements file:</p><pre><code>$ uv pip compile requirements.in \\\n   --universal \\\n   --output-file requirements.txt\nResolved 43 packages in 12ms\n</code></pre><p>Create a virtual environment:</p><pre><code>$ uv venv\nUsing Python 3.12.3\nCreating virtual environment at: .venv\nActivate with: source .venv/bin/activate\n</code></pre><p>Install the locked requirements:</p><pre><code>$ uv pip sync requirements.txt\nResolved 43 packages in 11ms\nInstalled 43 packages in 208ms\n + babel==2.15.0\n + black==24.4.2\n + certifi==2024.7.4\n ...\n</code></pre><p>See the <a href=\"https://docs.astral.sh/uv/pip/index/\" target=\"_blank\" rel=\"noopener\">pip interface documentation</a> to get started.</p><h2 id=\"Contributing\">Contributing</h2><p>We are passionate about supporting contributors of all levels of experience and would love to see you get involved in the project. See the <a href=\"https://github.com/astral-sh/uv?tab=contributing-ov-file#contributing\" target=\"_blank\" rel=\"noopener\">contributing guide</a> to get started.</p><h2 id=\"FAQ\">FAQ</h2><h4 id=\"Howdoyoupronounceuv\">How do you pronounce uv?</h4><p>It&#x27;s pronounced as &quot;you - vee&quot; (<a href=\"https://en.wikipedia.org/wiki/Help:IPA/English#Key\" target=\"_blank\" rel=\"noopener\"><code>/juː viː/</code></a>)</p><h4 id=\"HowshouldIstylizeuv\">How should I stylize uv?</h4><p>Just &quot;uv&quot;, please. See the <a href=\"https://github.com/astral-sh/uv/blob/HEAD/./STYLE.md#styling-uv\" target=\"_blank\" rel=\"noopener\">style guide</a> for details.</p><h4 id=\"Whatplatformsdoesuvsupport\">What platforms does uv support?</h4><p>See uv&#x27;s <a href=\"https://docs.astral.sh/uv/reference/platforms/\" target=\"_blank\" rel=\"noopener\">platform support</a> document.</p><h4 id=\"Isuvreadyforproduction\">Is uv ready for production?</h4><p>Yes, uv is stable and widely used in production. See uv&#x27;s <a href=\"https://docs.astral.sh/uv/reference/versioning/\" target=\"_blank\" rel=\"noopener\">versioning policy</a> document for details.</p><h2 id=\"Acknowledgements\">Acknowledgements</h2><p>uv&#x27;s dependency resolver uses <a href=\"https://github.com/pubgrub-rs/pubgrub\" target=\"_blank\" rel=\"noopener\">PubGrub</a> under the hood. We&#x27;re grateful to the PubGrub maintainers, especially <a href=\"https://github.com/Eh2406\" target=\"_blank\" rel=\"noopener\">Jacob Finkelman</a>, for their support.</p><p>uv&#x27;s Git implementation is based on <a href=\"https://github.com/rust-lang/cargo\" target=\"_blank\" rel=\"noopener\">Cargo</a>.</p><p>Some of uv&#x27;s optimizations are inspired by the great work we&#x27;ve seen in <a href=\"https://pnpm.io/\" target=\"_blank\" rel=\"noopener\">pnpm</a>, <a href=\"https://github.com/orogene/orogene\" target=\"_blank\" rel=\"noopener\">Orogene</a>, and <a href=\"https://github.com/oven-sh/bun\" target=\"_blank\" rel=\"noopener\">Bun</a>. We&#x27;ve also learned a lot from Nathaniel J. Smith&#x27;s <a href=\"https://github.com/njsmith/posy\" target=\"_blank\" rel=\"noopener\">Posy</a> and adapted its <a href=\"https://github.com/njsmith/posy/tree/main/src/trampolines/windows-trampolines/posy-trampoline\" target=\"_blank\" rel=\"noopener\">trampoline</a> for Windows support.</p><h2 id=\"License\">License</h2><p>uv is licensed under either of</p><ul><li>Apache License, Version 2.0, (<a href=\"https://github.com/astral-sh/uv/blob/HEAD/LICENSE-APACHE\" target=\"_blank\" rel=\"noopener\">LICENSE-APACHE</a> or )</li><li>MIT license (<a href=\"https://github.com/astral-sh/uv/blob/HEAD/LICENSE-MIT\" target=\"_blank\" rel=\"noopener\">LICENSE-MIT</a> or )</li></ul><p>at your option.</p><p>Unless you explicitly state otherwise, any contribution intentionally submitted for inclusion in uv by you, as defined in the Apache-2.0 license, shall be dually licensed as above, without any additional terms or conditions.</p><p><img class=\"md-img\" src=\"https://raw.githubusercontent.com/astral-sh/uv/main/assets/svg/Astral.svg\" alt=\"Made by Astral\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-orig=\"https://raw.githubusercontent.com/astral-sh/uv/main/assets/svg/Astral.svg\"></p></article><div class=\"rm-more\"><button data-more=\"Read more ↓\" data-less=\"Collapse ↑\">Read more ↓</button></div></div><aside class=\"ad\" data-slot=\"detail_end\"><div class=\"ad-hd\"><span>Ad</span></div><div class=\"ad-v\" data-start=\"\" data-end=\"\"><a href=\"submit.html\"><h4>Know a good project?</h4><p>Submissions go to human review.</p><span class=\"ad-cta\">Submit</span></a></div></aside></div><aside><div class=\"side-box toc\" id=\"rmToc\"><h4>On this page</h4><a class=\"\" href=\"#Highlights\">Highlights</a><a class=\"\" href=\"#Installation\">Installation</a><a class=\"\" href=\"#Documentation\">Documentation</a><a class=\"\" href=\"#Features\">Features</a><a class=\"lv3\" href=\"#Projects\">Projects</a><a class=\"lv3\" href=\"#Scripts\">Scripts</a><a class=\"lv3\" href=\"#Tools\">Tools</a><a class=\"lv3\" href=\"#Pythonversions\">Python versions</a><a class=\"lv3\" href=\"#Thepipinterface\">The pip interface</a><a class=\"\" href=\"#Contributing\">Contributing</a><a class=\"\" href=\"#FAQ\">FAQ</a><a class=\"\" href=\"#Acknowledgements\">Acknowledgements</a><a class=\"\" href=\"#License\">License</a></div><div class=\"side-box\"><h4>By language</h4><a href=\"ranking.html?tab=lang\">Rust <span style=\"float:right\">4</span></a><a href=\"ranking.html?tab=lang\">Python <span style=\"float:right\">2</span></a><a href=\"ranking.html?tab=lang\">JavaScript <span style=\"float:right\">1</span></a><a href=\"ranking.html?tab=lang\">Go <spa
